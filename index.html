<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuzeyfe Kalafat | Resmî Sanatçı Portalı</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; text-align: center; padding: 20px 15px; display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; }
        
        .top-content { max-width: 500px; margin: 0 auto; width: 100%; }
        
        /* Üst Header - Bayraklı ve Orijinal Renkli İkonlu Başlık */
        .portal-header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .portal-flag { font-size: 14px; }
        .portal-title { color: #888; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
        
        .top-social-icons { display: flex; align-items: center; gap: 8px; }
        .top-social-icons a { font-size: 13px; text-decoration: none; display: flex; align-items: center; }
        
        /* Orijinal İkon Renkleri */
        .color-ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .color-yt { color: #ff0000; }
        .color-fb { color: #1877f2; }
        .color-tk { color: #fe2c55; }
        .color-sp { color: #1db954; }
        
        /* X (Twitter) Özel SVG */
        .x-svg-icon { width: 13px; height: 13px; fill: #ffffff; display: inline-block; vertical-align: middle; }
        .footer-x-svg { width: 16px; height: 16px; fill: #ffffff; display: inline-block; vertical-align: middle; }

        /* Navigation */
        nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 30px; }
        nav a { color: #ccc; border: 1px solid #333; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 12px; text-transform: uppercase; font-weight: 600; transition: 0.3s; }
        nav a.active { background-color: #d4af37; color: #000; border-color: #d4af37; box-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }
        nav a:hover { border-color: #d4af37; color: #d4af37; }
        
        /* Katalog Bölümü */
        .catalog-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        
        .catalog-title { color: #d4af37; font-size: 22px; letter-spacing: 2px; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        .catalog-subtitle { color: #888; font-size: 12px; margin-bottom: 20px; letter-spacing: 1px; }

        .album-card { background: #141414; border: 1px solid #222; border-radius: 14px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; transition: 0.3s; box-shadow: 0 5px 20px rgba(0,0,0,0.4); }
        .album-card:hover { border-color: #d4af37; transform: translateY(-3px); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2); }

        .album-left { display: flex; align-items: center; gap: 15px; text-align: left; }
        .album-num { color: #d4af37; font-size: 16px; font-weight: bold; }
        .album-details .name { color: #fff; font-size: 15px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
        .album-details .info { color: #777; font-size: 11px; margin-top: 3px; }

        .album-arrow { color: #d4af37; font-size: 14px; transition: transform 0.3s; }
        .album-card:hover .album-arrow { transform: translateX(5px); }

        /* Footer */
        footer { padding: 20px 0; border-top: 1px solid #1a1a1a; margin-top: 20px; }
        .footer-icons { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 15px; }
        .footer-icons a { font-size: 18px; text-decoration: none; display: flex; align-items: center; transition: 0.3s; }
        .footer-icons a:hover { transform: scale(1.2); }
        .footer-text { color: #555; font-size: 11px; line-height: 1.6; }
    </style>
</head>
